<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAYDAY 2 — Трекер достижений</title>
<style>
  :root{--bg:#0b0d10;--panel:#14171c;--panel2:#1a1e25;--line:#272d36;--txt:#e8ebf0;
    --dim:#8a94a3;--acc:#f0a020;--acc2:#e2574c;--ok:#3fb950;--blue:#58a6ff;--purple:#a371f7}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column}
  a{color:var(--blue)}
  header{background:linear-gradient(90deg,#1c1510,#14171c);border-bottom:1px solid var(--line);
    padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
  header h1{font-size:15px;margin:0;color:var(--acc)}
  header h1 small{color:var(--dim);font-weight:400;margin-left:7px;font-size:12px}
  .stat{font-size:12px;color:var(--dim)} .stat b{color:var(--txt);font-size:14px}
  .grow{flex:1}
  button,input[type=search],input[type=text]{background:var(--panel2);color:var(--txt);
    border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px}
  button{cursor:pointer} button:hover{border-color:var(--acc)}
  button.on{background:var(--acc);color:#12100c;font-weight:600}
  button.go{background:#1d3a26;border-color:#2f5138;color:#9fdfb0}
  button.danger{background:#2a1516;border-color:#4a2626;color:#e0a3a0}
  input[type=search]{cursor:text;min-width:170px}

  #importbar{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;
    background:#111820;border-bottom:1px solid var(--line)}
  #importbar.show{display:flex}
  #importbar .msg{font-size:12px;color:var(--dim)}
  #importbar .msg.ok{color:var(--ok)} #importbar .msg.err{color:var(--acc2)}
  #live{font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid var(--line);color:var(--dim)}
  #live.on{border-color:#2f5138;color:var(--ok);background:#111a15}
  #btn-auto.live{border-color:#2f5138;color:#9fdfb0;background:#111a15}
  #btn-auto.checking{border-color:#4a3a20;color:var(--acc)}
  #steam-when{font-size:11px}
  #steam-when.bad{color:var(--acc2)}

  #wrap{flex:1;display:flex;min-height:0}
  #side{width:320px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0;position:relative}
  #side .bar{padding:9px;border-bottom:1px solid var(--line);display:grid;gap:6px;overflow:hidden}
  #side .bar input{width:100%}
  #heistlist{overflow-y:auto;flex:1;min-height:0;padding-bottom:40px}
  #achresults{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 0 40px}
  #achresults *{min-width:0;max-width:100%}
  .ares{display:block;width:100%;max-width:100%;box-sizing:border-box;text-align:left;background:none;
    border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 12px;cursor:pointer;
    color:var(--txt);overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
  .ares:hover{background:var(--panel2)} .ares .an{font-size:13px;font-weight:600}
  .ares .an em{color:var(--acc);font-style:normal}
  .ares .aw{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ares .ac{font-size:11.5px;color:var(--dim);margin-top:1px;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    padding:11px 12px 4px;font-weight:700}
  .hitem{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;border-left:3px solid transparent}
  .hitem:hover{background:var(--panel2)} .hitem.sel{background:#232932;border-left-color:var(--acc)}
  .hitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .hitem .rn{font-size:10.5px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);
    color:var(--dim);flex-shrink:0;font-variant-numeric:tabular-nums}
  .hitem .rn.many{color:var(--acc2);border-color:#4a2626}
  .bar-mini{height:3px;background:var(--line);border-radius:2px;width:34px;overflow:hidden;flex-shrink:0}
  .bar-mini i{display:block;height:100%;background:var(--ok)}
  .pill{font-size:10px;padding:0 5px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
  .pill.st{color:var(--blue)} .pill.ld{color:var(--acc2)}

  #main{flex:1;overflow-y:auto;min-width:0;display:flex;flex-direction:column}
  #maininner{display:grid;grid-template-columns:minmax(0,1fr) 400px;flex:1;min-height:0}
  @media (max-width:1200px){#maininner{grid-template-columns:minmax(0,1fr)}}
  .colmain{overflow-y:auto;padding:16px 20px 90px;min-width:0}
  .colside{overflow-y:auto;padding:16px 14px 90px;min-width:0;border-left:1px solid var(--line);background:#0f1216}
  @media (max-width:1200px){.colside{border-left:0;border-top:1px solid var(--line)}}
  .topbar{display:grid;grid-template-columns:1fr 210px;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,#1c1510,#14171c)}
  .topbar .cellname{padding:11px 20px;border-right:1px solid var(--line)}
  .topbar .cellruns{padding:11px 16px;text-align:center}
  .topbar .lbl{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim)}
  .topbar .nm{font-size:21px;font-weight:700;margin-top:1px}
  .topbar .nm .orig{font-size:14px;font-weight:400;color:var(--dim);margin-left:8px}
  .topbar .big{font-size:30px;font-weight:800;color:var(--acc);line-height:1.05}
  .topbar .sub2{font-size:11px;color:var(--dim)}
  .hdesc{color:#aeb7c4;font-size:13px;margin:10px 0 0;max-width:900px}

  .plan{background:linear-gradient(180deg,#1b1710,#14171c);border:1px solid #3a2f1c;
    border-radius:12px;padding:14px 16px;margin:14px 0 22px}
  .plan h3{margin:0 0 3px;font-size:15px;color:var(--acc)}
  .plan .sub{color:var(--dim);font-size:12px;margin-bottom:11px}
  .runs{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:10px}
  .run{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .run .no{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
  .run .cfg{font-size:12.5px;font-weight:600;margin:2px 0 7px}
  .run ul{margin:6px 0 0;padding-left:15px} .run li{font-size:11.5px;color:var(--dim);margin:1px 0}
  .run .cats{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
  .chipcat{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--dim)}
  .chipcat.pc-ladder{color:#8ab4f8;border-color:#24384f}
  .chipcat.pc-run_cond{color:#f0a020;border-color:#4a3a20}
  .chipcat.pc-objective{color:#7fd1a0;border-color:#244634}
  .chipcat.pc-loadout{color:#d8a0f0;border-color:#3d2f52}
  .chipcat.pc-crew{color:#c9a0f0;border-color:#4a3060}
  .chipcat.plus{color:#6fb3c9;border-color:#234049}

  .sect{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);
    margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sect.small{font-size:11px;margin:14px 0 8px}
  .sect.shared{color:var(--acc);border-bottom-color:#4a3a20}
  .sect.lobby{color:#7f8b9c;border-bottom-color:#39404b}
  .sect.ladder{color:#8ab4f8;border-bottom-color:#24384f}
  .vnote{color:var(--dim);font-size:12px;margin:10px 0 0;max-width:880px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .card{position:relative;display:flex;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px;align-items:flex-start}
  .card.done{background:#111a15;border-color:#2f5138;box-shadow:inset 3px 0 0 var(--ok)}
  .card.done .nm{text-decoration:line-through;color:#86c496}
  .card.done .cond,.card.done .conden{color:#6d8877}
  .card img{width:52px;height:52px;border-radius:6px;background:#0f1216;flex-shrink:0;object-fit:cover}
  .card .body{flex:1;min-width:0}
  .card .nm{font-weight:600;font-size:13.5px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
  .card .nm .orig{color:var(--dim);font-weight:400;font-size:11.5px}
  .card .cond{color:#9aa4b2;font-size:12px;margin-top:3px}
  .card .conden{color:#6d7684;font-size:11.5px;margin-top:2px}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .b{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
  .b.rw{color:var(--ok);border-color:#22402a} .b.dep{color:var(--acc2);border-color:#4a2626}
  .b.crew{color:var(--purple);border-color:#6b4fa0;background:#1c1526} .b.lob{color:var(--dim);border-color:#3a414c}
  .b.ex{color:#e0a3a0;border-color:#4a2e2c} .b.day{color:var(--blue);border-color:#24384f}
  .b.fit{color:#9fdfb0;border-color:#2f5138}
  .b.pc-ladder{color:#8ab4f8;border-color:#24384f}
  .b.pc-run_cond{color:#f0a020;border-color:#4a3a20}
  .b.pc-objective{color:#7fd1a0;border-color:#244634}
  .b.pc-loadout{color:#d8a0f0;border-color:#3d2f52}
  .b.pc-crew{color:#c9a0f0;border-color:#4a3060}
  .b.pc-farmable{color:#6fb3c9;border-color:#234049}
  .b.pc-meta{color:#9aa4b2;border-color:#333a44}
  .dep{font-size:11.5px;color:var(--acc2);margin-top:6px;padding:5px 7px;background:#1d1414;
    border-left:2px solid var(--acc2);border-radius:0 5px 5px 0}
  .dep b{color:#ffb3aa}
  .dep.free-note{color:var(--dim);background:#171a1f;border-left-color:var(--line)}
  .chk{width:15px;height:15px;accent-color:var(--acc);cursor:pointer;flex-shrink:0;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);cursor:pointer;color:var(--dim);user-select:none}
  .chip.on{background:var(--acc);color:#12100c;border-color:var(--acc);font-weight:600}
  .chip-ladder{border-color:#24384f;color:#8ab4f8}
  .chip-run_cond{border-color:#4a3a20;color:#f0a020}
  .chip-objective{border-color:#244634;color:#7fd1a0}
  .chip-loadout{border-color:#3d2f52;color:#d8a0f0}
  .chip-crew{border-color:#4a3060;color:#c9a0f0}
  .chip-farmable{border-color:#234049;color:#6fb3c9}
  .chip-meta{border-color:#333a44;color:#9aa4b2}
  .catsec-ladder{border-bottom-color:#24384f}
  .catsec-run_cond{border-bottom-color:#4a3a20;color:#d8a860}
  .catsec-objective{border-bottom-color:#244634;color:#9ad8b4}
  .catsec-loadout{border-bottom-color:#3d2f52;color:#c4a0e0}
  .catsec-crew{border-bottom-color:#4a3060;color:#c9a0f0}
  .catsec-farmable{border-bottom-color:#234049;color:#8fc8dc}
  .catsec-meta{border-bottom-color:#333a44}
  .chip .n{opacity:.7;margin-left:4px}
  .vtabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px}
  .vtab{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;font-size:13px;color:var(--dim);text-align:left}
  .vtab:hover{border-color:var(--acc)} .vtab.on{border-color:var(--acc);background:#241d10;color:var(--txt);font-weight:600}
  .vtab .en{display:block;font-size:10.5px;font-weight:400;color:var(--dim);margin-top:1px}
  .vtab.on .en{color:var(--acc)} .vtab .n{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
  .empty{color:var(--dim);padding:40px;text-align:center}
  #toast{position:fixed;right:16px;bottom:16px;background:#14251a;border:1px solid #2f5138;
    color:#9fdfb0;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;
    transition:opacity .3s;pointer-events:none;z-index:60}
  #toast.show{opacity:1}
  .goal{background:linear-gradient(180deg,#1b1710,#14171c);border:1px solid #3a2f1c;
    border-radius:12px;padding:14px 18px;margin:0 0 18px}
  .goal .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .goal .lbl{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim)}
  .goal .nm{font-size:16px;font-weight:700;margin-top:2px}
  .goal .cn{font-size:42px;font-weight:800;color:var(--acc);line-height:1}
  .goal .cn small{font-size:18px;color:var(--dim);font-weight:600}
  .goal .track{flex:1;min-width:180px;height:9px;background:#0f1216;border-radius:5px;overflow:hidden;
    border:1px solid var(--line)}
  .goal .fill{height:100%;background:linear-gradient(90deg,#c47f10,var(--acc));border-radius:5px}
  .goal .pct{font-size:12px;color:var(--dim)}
  .goal .btns{display:flex;gap:6px}
  .goal.done .cn{color:var(--ok)}
  .goal.done{border-color:#2f5138}
  .goal.done .fill{background:var(--ok)}
  .pin{margin-top:6px;font-size:11px;padding:2px 8px;border-radius:11px;cursor:pointer;
    border:1px solid #3a2f1c;background:#1b1710;color:var(--acc)}
  .pin:hover{border-color:var(--acc)}
  /* ---- счётчик в стиле окна достижений Steam ---- */
  .cntcard{display:flex;gap:18px;align-items:center;background:#1b1e22;
    border:1px solid #2b2f34;border-radius:6px;padding:16px 18px;margin:0 0 14px}
  .cntcard .cico{width:92px;height:92px;flex:none;border:1px solid #3a3f45;background:#0e1013;
    display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:3px}
  .cntcard .cico img{width:100%;height:100%;object-fit:cover;display:block}
  .cntcard .cbody{flex:1;min-width:0}
  .cntcard .cnm{font-size:19px;font-weight:700;line-height:1.2;margin-bottom:6px}
  .cntcard .cnm .orig{display:block;font-size:12px;font-weight:400;color:var(--dim);margin-top:3px}
  .cntcard .cds{font-size:13px;color:#9aa0a6;line-height:1.45;margin-bottom:10px}
  .sbar{position:relative;display:flex;height:30px;background:#4b5157;border-radius:2px;
    overflow:hidden;align-items:center;justify-content:center}
  .sfill{position:absolute;left:0;top:0;bottom:0;background:#a4d007}
  .snum{position:relative;z-index:1;font-size:15px;font-weight:700;color:#e8eaed;
    letter-spacing:.3px;white-space:nowrap}
  .snum .cur{color:#e8eaed}
  .snum.over .cur{color:#1d2206}
  .cntcard.fin .sfill{background:#6fae2a}
  .cfoot{font-size:12px;color:#8b9298;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;
    align-items:center}
  .cfoot .left{color:#a4d007;font-weight:600}
  .cntcard .cbtns{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .cntcard input.num{width:88px;padding:4px 7px;border-radius:6px;background:#0e1013;
    border:1px solid #3a3f45;color:var(--fg);font:inherit;font-size:12px}
  /* ---- сводка по прогрессу ---- */
  .psum{background:linear-gradient(180deg,#151a20,#12161b);border:1px solid var(--line);
    border-radius:12px;padding:16px 20px;margin:0 0 18px}
  .psum .ph{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .psum .pbig{font-size:34px;font-weight:800;line-height:1}
  .psum .pbig small{font-size:17px;color:var(--dim);font-weight:600}
  .psum .ptot{color:var(--dim);font-size:13px}
  .psum .ptrack{height:14px;background:#0f1216;border:1px solid var(--line);border-radius:7px;
    overflow:hidden;margin-bottom:12px}
  .psum .pfill{height:100%;background:linear-gradient(90deg,#8a6d10,var(--acc));border-radius:7px}
  .psum .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:9px}
  .psum .pcell{background:#11151a;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .psum .pcell .k{font-size:11px;color:var(--dim)}
  .psum .pcell .v{font-size:17px;font-weight:700;margin-top:2px}
  .psum .pcell .m{font-size:11px;color:var(--dim);margin-top:2px}
  .ver{font-size:11px;color:var(--dim);letter-spacing:.4px}
  #updpanel{border-bottom:1px solid var(--line);background:#141821;padding:10px 22px}
  #updpanel .upd-body{font-size:13px;color:var(--fg);line-height:1.5}
  .upd-notes{display:block;color:var(--dim);font-size:12px;margin:5px 0}
  .upd-go{margin-top:7px;padding:6px 14px;border-radius:8px;border:1px solid var(--acc);
    background:#1b1710;color:var(--acc);font:inherit;font-size:12px;cursor:pointer}
  .upd-go:hover{background:var(--acc);color:#10131a}
  .upd-bar{height:7px;background:#0f1216;border:1px solid var(--line);border-radius:4px;
    overflow:hidden;margin-top:8px}
  .upd-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6d10,var(--acc));
    transition:width .2s}
  .hitem.goaltab{border-color:#3a2f1c;background:#1b1710}
  .hitem.goaltab.sel{border-color:var(--acc)}
  #bar{position:fixed;left:0;bottom:0;height:3px;background:var(--acc);transition:width .2s;z-index:50}
</style>
</head>
<body>
<header>
  <h1>PAYDAY 2 <small>трекер достижений</small></h1>
  <div class="stat">Хайстов: <b id="s-heist">0</b></div>
  <div class="stat">Достижений: <b id="s-ach">0</b></div>
  <div class="stat">Отмечено: <b id="s-done">0</b> / <span id="s-tot">0</span>
    <span id="s-pct" style="color:var(--acc);font-weight:700"></span></div>
  <div class="grow"></div>
  <span id="live" title="связь с игрой">офлайн</span>
  <span id="ver" class="ver" title="версия приложения"></span>
  <button id="btn-update">Обновление</button>
  <button id="btn-import">Импорт прогресса</button>
  <button id="btn-reset">Сбросить</button>
</header>

<div id="updpanel" hidden>
  <div id="upd-body" class="upd-body">Проверяю обновления…</div>
  <div id="upd-bar" class="upd-bar" hidden><i></i></div>
</div>

<div id="importbar">
  <input type="text" id="steam-url" size="52"
         placeholder="ссылка на профиль Steam: https://steamcommunity.com/profiles/7656119.../stats/218620/achievements">
  <button class="go" id="btn-steam">Загрузить из Steam</button>
  <button id="btn-auto" title="Следить за профилем, пока играешь">Автообновление: выкл</button>
  <span id="steam-when" class="msg"></span>
  <input type="text" id="file-path" size="34" placeholder="путь к файлу со списком (необязательно)">
  <button id="btn-file">Из файла</button>
  <button id="btn-verify">Проверить данные</button>
  <button id="btn-wipe" class="danger">Сбросить всё и удалить файл</button>
  <span class="msg" id="imp-msg"></span>
</div>

<div id="wrap">
  <div id="side">
    <div class="bar">
      <input type="search" id="q" placeholder="Поиск хайста…">
      <input type="search" id="qa" placeholder="Поиск достижения…">
    </div>
    <div id="achresults" hidden></div>
    <div id="heistlist"></div>
  </div>
  <div id="main"></div>
</div>
<div id="toast"></div>
<div id="bar"></div>

<script>

amstatic.com/community_assets/images/apps/218620/b0719a060a3757fca8c572b606aae108190ff0a1.jpg","h":[],"df":[],"r":{"weapons":["Theia Magnified Scope"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":521,"n":"Return to Sender","nr":"Возврат отправителю","d":"Kill 25 Snipers using only the Rattlesnake sniper rifle. Unlocks the \"Tactical Aluminium Body\" for the Rattlesnake sniper rifle.","dr":"Убейте 25 снайперов, используя только снайперскую винтовку Rattlesnake. Открывает «Тактический алюминиевый корпус» для винтовки Rattlesnake.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/3c5ac499d1474b22c72c7ba199afe83b01b6c840.jpg","h":[],"df":[],"r":{"weapons":["Tactical Aluminium Body"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":522,"n":"Double Kill","nr":"Двойное убийство","d":"Kill 2 enemies with one bullet 25 times using only the Rattlesnake sniper rifle. Unlocks the \"Sniper Suppressor\" for the Rattlesnake sniper rifle.","dr":"Убейте двух врагов одной пулей 25 раз из снайперской винтовки Rattlesnake. Выполнение этого достижения открывает снайперский глушитель для винтовки Rattlesnake.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/c637165a3749e7630dc2b72fcfb5a0d635078157.jpg","h":[],"df":[],"r":{"weapons":["Sniper Suppressor"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":523,"n":"Every day I'm Shovelin'","nr":"Каждый день я вкапываюсь","d":"On the Nightclub job, kill 25 law enforcers using your shovel. Unlocks the \"Short Barrel\" for the Raven shotgun.","dr":"Выполняя контракт «Ночной клуб», убейте 25 полицейских лопатой. Выполнение достижения открывает укороченный ствол для дробовика Raven.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/2553f73cd6afb7fa8e9dc843de82e00f349c7353.jpg","h":["nightclub"],"df":[],"r":{"weapons":["Short Barrel"]},"c":"count","sc":"heist","dy":null,"dp":[],"fit":"extra"},{"i":524,"n":"Hey Mr. DJ","nr":"Эй, диджей","d":"In the Nightclub job, have 12 hostages or more on the dance floor when you escape. Unlocks the \"Aluminum Grip\" for the AK weapon family, the \"Aluminum Foregrip\" for the Krinkov submachine gun and the \"LW Upper Receiver\" for the CAR weapon family.","dr":"Завершите контракт «Ночной клуб», оставив 12 связанных заложников на танцполе перед побегом. Выполнение достижения открывает алюминиевую рукоять для винтовок типа АК, алюминиевое цевьё для пистолета-пулемёта Krinkov и верхний ресивер LW для винтовок типа CAR. Примечание: Несвязанные заложники будут учитываться в этом достижении, если они будут запуганы.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/da003c5af73390e1232cf8e542832db8492f5529.jpg","h":["Nightclub","nightclub"],"df":[],"r":{"weapons":["Aluminum Grip"]},"c":"other","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":525,"n":"Becoming Opprobrious","nr":"Пугающий","d":"Reach the sixteenth rank of Infamy.","dr":"Достигните шестнадцатого уровня бесславия.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/7c461e79a2a0c28206bc3c7393b6f26a0ac12050.jpg","h":[],"df":[],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":526,"n":"Becoming Shady","nr":"Сомнительный","d":"Reach the seventeenth rank of Infamy.","dr":"Достигните семнадцатого уровня бесславия.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/6064b99cb8ab1743d6ca45616dd7f391c67017d6.jpg","h":[],"df":[],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":527,"n":"Cutting the Red Wire","nr":"Перерезать красный провод","d":"On the Counterfeit job, disarm the C4 on the OVERKILL difficulty or above. Unlocks the \"Dragon Head\" mask, \"Days\" material and \"Kurbits\" pattern.","dr":"Выполняя контракт «Подделка», обезвредьте все заряды C4 на уровне сложности «OVERKILL» или выше. Выполнение достижения открывает маску «Голова дракона», материал «Дни» и рисунок «Узоры».","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/37834aab326928ee73bec4cd0620e43f9a59cb11.jpg","h":["Counterfeit","counterfeit"],"df":["overkill"],"r":{"masks":["Dragon Head"],"materials":["Days"],"patterns":["Kurbits"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":528,"n":"Well in Russia Asshole Facks You!","nr":"В России побеждают мудаки!","d":"Complete the Hotline Miami job on the Mayhem difficulty or above.","dr":"Завершите контракт «Горячая линия Майами» на уровне сложности «Хаос» или выше.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/9035e04e421c5c9e4ac31018ff13600bfb2b2c6c.jpg","h":["Hotline Miami","hotline_miami"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":529,"n":"Of Pigs and Pigs","nr":"Свиньи среди свиней","d":"Complete the Slaughterhouse job on the Mayhem difficulty or above.","dr":"Завершите контракт «Скотобойня» на уровне сложности «Хаос» или выше.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/012efad30edf0a555830c9af51a68c6cb709811f.jpg","h":["Slaughterhouse","slaughterhouse"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":530,"n":"You Cockroaches Wanna Play Rough?","nr":"Вы, Таракашки, Хотите играть по-плохому?","d":"Complete the Scarface Mansion job on the Mayhem difficulty or above.","dr":"Завершите контракт «Особняк Лица со шрамом» на уровне сложности «Хаос» или выше.","p":6.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/42e44b82d6db96359575cadd0ce5b08b8a27f874.jpg","h":["Scarface Mansion","scarface"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":531,"n":"Sailing Home","nr":"Отплытие домой","d":"Complete The Bomb: Dockyard job on the Ha ение также открывает прицел на ствол 44, пламегаситель .L 44 для пистолета Broomstick, а также материал «Красное солнце» и рисунок «Торговец смертью».","p":6.2,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/bed53f25cb83d16d88fbe111b984fed3b1791017.jpg","h":[],"df":[],"r":{"masks":["Red Bear"],"weapons":["Folded Stock","Heatsinked Suppressed Barrel","No Stock","Red Bear","Short Barrel","Short Mag","Solid Stock","Suppressed Barrel"],"materials":["Red Sun"],"patterns":["Death Dealer"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":559,"n":"Sneaking With the Fishes","nr":"Тише рыбы","d":"Complete The Bomb: Dockyard job in stealth on the Death Wish difficulty or above. Unlocks the \"Lady Butcher\" mask, \"Rhino\" material and \"Checker Board\" pattern.","dr":"Завершите контракт «Бомба: Доки» на уровне сложности «Жажда смерти» или выше, не поднимая тревоги. Выполнение достижения открывает маску «Леди мясник», материал «Носорог» и рисунок «Шахматная доска».","p":6.2,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/dd6c8eac47b3500b688afdda84e578772991fe82.jpg","h":["bomb_dockyard"],"df":["death wish"],"r":{"masks":["Lady Butcher"],"materials":["Rhino"],"patterns":["Checker Board"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":560,"n":"OVE SAW 72000","nr":"OVE SAW 72000","d":"In the Nightclub job, complete the heist on any difficulty with each crew member using the OVE 9000 saw as primary and secondary weapons. Unlocks the \"THRUST Upper Receiver\", \"THRUST Lower Receiver\" and \"Long Ergo Foregrip\" for the CAR weapon family.","dr":"Завершите контракт «Ночной клуб» на любом уровне сложности так, чтобы все члены команды использовали пилу как первичное и вторичное оружие. Выполнение достижения открывает нижний и верхний ресивер THRUST, а также длинное эргономичное цевьё для винтовок типа CAR.","p":6.2,"img":"https://shared.fastly.steamstatic.com/community_assets/imag ndition","sc":"heist","dy":3,"dp":[],"fit":"own"},{"i":578,"n":"Temper Tantrum","nr":"Вспышка гнева","d":"In the Safe House Nightmare job find the correct baby mask on the Very Hard difficulty. Unlocks the \"Angry Baby\" mask.","dr":"Выполняя контракт «Кошмар в Убежище», найдите правильную маску младенца на уровне сложности «Очень сложно». Открывает маску «Злой младенец».","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/f32e0955774f2e024a27d99745b7751ed4aa041d.jpg","h":["Safe House: Nightmare","safe_house_nightmare"],"df":["hard","very hard"],"r":{"masks":["Angry Baby"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":579,"n":"Long-Term Relationship","nr":"Долгосрочные отношения","d":"Complete all of Bain's contracts on the Death Wish difficulty or above.","dr":"Завершите все контракты Бэйна на уровне сложности «Жажда смерти» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/27bc1197559fb1922cb0b6e953ef3f6032cbb2b9.jpg","h":[],"df":["death wish"],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":580,"n":"So Uncivilized","nr":"Так нецивилизованно","d":"Equip a Broomstick pistol with the Damper.L 44 Nozzle and the Barrel Sight 44. Unlocks the \"British Bulldog\" mask, \"High Capacity Mag\" and \"Holster Stock\" for the Broomstick pistol, \"Army Green\" material and \"Filthy Thirteen\" pattern.","dr":"Выберите в инвентаре пистолет Broomstick с установленным на него пламегасителем L 44 и прицелом на ствол 44. Выполнение достижения открывает маску «Английский бульдог», увеличенный магазин и кобуру-приклад для пистолета Broomstick, а также материал «Армейский зелёный» и рисунок «Чёртова дюжина».","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/a19a6ff9f876864933c5627eec383018ceea4c51.jpg","h":[],"df":[],"r":{"masks":["British Bulldog"],"weapons":["British Bulldog","High Capacity Mag","Holster Stock"],"materials":["Army Green"],"patterns":["Filthy Thirteen"]},"c":"collect","sc":"lobby","dy":null,"dp":[],"fit":null},{"i":581,"n":"$1.8M Speedrun","nr":"Спидран на $1.8M","d":"In the Mallcrasher job, loot $1,800,000 in loose cash within 50 seconds of starting the heist. The heist must be played on the OVERKILL difficulty. Unlocks the \"Scope Mount\" and \"PBS Suppressor\" for the AK weapon family, \"Alfred\" mask, \"Dawn\" material and \"Dinosaur Skull\" pattern.","dr":"Выполняя контракт «Крушитель» на уровне сложности «OVERKILL», украдите мелкие предметы общей стоимостью в $1,800,000 в течение 50 секунд после начала ограбления. Выполнение достижения открывает рейку для прицела и глушитель PBS для винтовок семейства AK, а также маску «Альфред», материал «Рассвет» и рисунок «Череп динозавра».","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/9fd5207c305093b9538871cf6593b2bc5696fbbe.jpg","h":["Mallcrasher","mallcrasher"],"df":["overkill"],"r":{"weapons":["PBS Suppressor","Scope Mount"],"masks":["Alfred"],"materials":["Dawn"],"patterns":["Dinosaur Skull"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":582,"n":"It's Getting Hot in Here","nr":"Здесь становится жарко","d":"In the Firestarter job, complete day 3 with you and your crew staying inside the vault while all of the money burns out on the Death Wish difficulty or above.","dr":"Завершите третий день контракта «Поджигатель» на уровне сложности «Жажда смерти» или выше так, чтобы все члены команды оставались в хранилище, пока горят деньги.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/9e85ef84f9297d1ddd73a1e0dd277899734b26c0.jpg","h":["Firestarter","firestarter"],"df":["death wish"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":3,"dp":[],"fit":"own"},{"i":583,"n":"Not Invited","nr":"Без приглашения","d":"Kill 10 enemies within 10 seconds using the Piglet Grenade Launcher without using Incendiary rounds. Unlocks the \"Firefighter's Helmet\" mask, \"Burn\" material and \"Flamer\" pattern.","dr":"Убейте 10 противников в течение 10 секунд с помощью гранатомёта Piglet. Запрещается использовать зажигательные и ядовитые боеприпасы. Выполнение достижения открывает маску «Шлем пожарного», материал «Огонь» и рисунок «Поджигатель».","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/654305a8923f24b1edc7b21bdcc196d8d8b8b1d6.jpg","h":[],"df":[],"r":{"masks":["Firefighter's Helmet"],"materials":["Burn"],"patterns":["Flamer"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":584,"n":"Pedal to the Metal","nr":"Гашетку в пол","d":"Complete the Meltdown job on the Death Wish difficulty or above.","dr":"Завершите контракт «Ядерная угроза» на уровне сложности «Жажда смерти» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/9a5da6749164de98c39b6836427c97c8374ac6d9.jpg","h":["Meltdown","meltdown"],"df":["death wish"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":585,"n":"1... 2... 3... JUMP!","nr":"1… 2… 3… ПРЫГАЙ!","d":"In the Birth of Sky job, have the entire crew jump out of the airplane within 1 minute and 23 seconds on the OVERKILL difficulty or above.","dr":"Выполняя контракт «Рождение небес» на уровне сложности «OVERKILL» или выше, сделайте так, чтобы все члены команды совершили прыжок с парашютом не более чем за 1 минуту и 23 секунды. Выполнение достижения открывает маску «Мауи», материал «Брод» и рисунок «Декоративная корона».","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/f54817a939eb9f63cff76909d9c51205c33a9401.jpg","h":["Birth of Sky","birth_of_sky"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":586,"n":"Only Santa Brings Gifts","nr":"Только Санта дарит подарки","d":"In the Santa's Workshop job, secure 10 bags of loot without using any player equipment or assets.","dr":"Выполняя контракт «Мастерская Санты», украдите 10 сумок с ценностями, не используя активы и снаряжение (аптечки, патроны, турели и т. д.).","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/0876868472ab77431b2a50ee9040194743033f5d.jpg","h":["Santa’s Workshop","santa_workshop"],"df":[],"r":{},"c":"run_condition","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":587,"n":"Panic in the Projects","nr":"Паника в проекте","d":"Complete the Panic Room job on the Mayhem difficulty or above.","dr":"Завершите контракт «Комната паники» на уровне сложности «Хаос» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/ba47be91ac23a72e899f57b58d27c4c9ca9d6a8e.jpg","h":["Panic Room","panic_room"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":588,"n":"Great White","nr":"Большая белая","d":"Complete The Yacht Heist on the Death Wish difficulty or above.","dr":"Завершите контракт «Яхта» на уровне сложности «Жажда смерти» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/cf762bf30216a29c137f77f335db6cdfe703d2e2.jpg","h":["The Yacht Heist","yacht"],"df":["death wish"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":589,"n":"Hello, My Friends!","nr":"Здравствуйте, мои друзья!","d":"Complete all of Vlad's contracts on the Normal difficulty or above.","dr":"Завершите все контракты Влада на уровне сложности «Нормально» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/81a226d64e48f95c60bdc479dfbae91c2294ba17.jpg","h":[],"df":["normal"],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":590,"n":"Thanks for Your Contribution","nr":"Спасибо за ваш вклад","d":"Complete all of the Elephant's contracts on the Normal difficulty or above.","dr":"Завершите все контракты Слона на уровне сложности «Нор t","downtown","transport"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":595,"n":"Criminal Waters","nr":"Криминальные воды","d":"Complete the Transport: Harbor job on the OVERKILL difficulty or above.","dr":"Завершите контракт «Транспорт: гавань» на уровне сложности «OVERKILL» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/9b73fa299589ea00c4fcc3b6314b3f45d4098fed.jpg","h":["Transport","transport"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":596,"n":"Stroll in the Park","nr":"Проездом в парке","d":"Complete the Transport: Park job on the OVERKILL difficulty or above.","dr":"Завершите контракт «Транспорт: парк» на уровне сложности «OVERKILL» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/a4be19d63ef941dce953da3c598baa8a9daa2b77.jpg","h":["Transport","transport"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":597,"n":"Salem's Lot","nr":"Лот Салема","d":"Complete the Shacklethorne Auction job on the OVERKILL difficulty or above.","dr":"Завершите контракт «Аукцион Шаклторн» на уровне сложности «OVERKILL» или выше.","p":6.1,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/0e33696bb90f208941327d153c1a0fe1b2be88f0.jpg","h":["Shacklethorne Auction","shacklethorne"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":598,"n":"Mall Ninja","nr":"Магазинный ниндзя","d":"Modify the CAR-4 rifle with a Gazelle Rail, Tactical Compensator, Compact Holosight, Wide Stock and a Military Laser Module.","dr":"Установите рейку «Газель», насадку «Тактик», компактный голографический прицел, широкий приклад и военный лазерный модуль на винтовку на винтовку CAR-4.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/d3c4e8afe05588b3404828652b37461caa2bc300.jpg","h":[],"df":[],"r":{},"c":"collect","sc":"lobby","dy":null,"dp":[],"fit":null},{"i":599,"n":"Entrapment","nr":"Западня","d":"In the Big Bank job, complete the heist with 12 bags in the default escape with all the lasers active. Unlocks the \"CQB Foregrip\" for the Falcon rifle.","dr":"Завершите контракт «Большой банк», унеся с собой 12 сумок с добычей, не изменяя план побега и не отключая лазеры. Выполнение достижения открывает цевьё CQB для винтовки Falcon.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/7c44c25bf9e270a7d7810b9a220e4edfa457230e.jpg","h":["Big Bank","big_bank"],"df":[],"r":{"weapons":["CQB Foregrip"]},"c":"run_condition","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":600,"n":"Precision Aiming","nr":"Меткая стрельба","d":"Kill 25 Bulldozers using the Gewehr 3 Rifle. Unlocks the \"Sniper Barrel\" for the Clarion rifle, \"Sniper Stock\", \"Sniper Grip\" and \"Sniper Foregrip\" for the Gecko 7.62 rifle, \"Precision Stock\", \"Precision Foregrip\", \"Precision Grip\" and the \"DMR Kit\" for the Gewehr 3 rifle as well as the \"Black Death\" mask.","dr":"Убейте 25 Бульдозеров с помощью винтовки Gewehr 3. Выполнение достижения открывает снайперский ствол для винтовки Clarion, снайперскую рукоять, снайперское цевьё и снайперский приклад для винтовки Gecko 7.62, набор DMR, приклад и цевьё меткого стрелка для винтовки Gewehr 3, а также маску «Чёрная смерть».","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/953bd9c3c3f878836ce5ab802477a51e2447836f.jpg","h":[],"df":[],"r":{"weapons":["Sniper Barrel"],"masks":["Black Death"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":601,"n":"Rabbit Hunting","nr":"Охота на кроликов","d":"Kill 10 Cloakers using the Gecko 7.62 rifle. Unlocks the \"Skeletal Stock\", \"Fabulous Stock\" and \"Fabulous Foregrip\" for the Gecko 7.62 rifle as well as the \"Volt\" mask.","dr":"Убейте 10 Клокеров с помощью винтовки Gecko 7.62. Выполнение достижения открывает скелетный приклад, легендарный приклад, легендарное цевье для винтовки Gecko 7.62, а также маску «Вольт».","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/126b0a4203a6355cb5eaefb21128637ce14f9684.jpg","h":[],"df":[],"r":{"masks":["Volt"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":602,"n":"Speedlock Holmes","nr":"Спидлок Холмс","d":"On day 1 of the Election Day job, tag the right truck and leave within a minute of the start of the heist.","dr":"Выполняя первый день контракта «День выборов», отметьте правильный грузовик и сбегите в течение минуты после начала ограбления.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/786c77735b065268daab498d1a8b51994a10bfaf.jpg","h":["Election Day","election_day"],"df":[],"r":{},"c":"other","sc":"heist","dy":1,"dp":[],"fit":"own"},{"i":603,"n":"Swiss Cheese","nr":"Швейцарский сыр","d":"Kill 100 enemies in a single day of a heist with the Kross Vertex Submachine Gun. Unlocks the \"Kage\" mask, \"Sakura\" material and \"Oni\" pattern.","dr":"Убейте 100 противников на любом ограблении с помощью пистолета-пулемёта Kross Vertex. Выполнение достижения открывает маску «Каге», материал «Сакура» и рисунок «Они».","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/af157d80472de3e76f25c4134d7cce5f126ad1eb.jpg","h":[],"df":[],"r":{"masks":["Kage"],"materials":["Sakura"],"patterns":["Oni"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":604,"n":"Pyromaniacs","nr":"Пироманьяки","d":"In the Slaughterhouse job, pick up two gasoline tanks within 30 seconds of entering the slaughterhouse.","dr":"Выполняя контракт «Скотобойня», соберите две канистры с горючим за 30 секунд после того, как войдёте в помещение.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/7c15aa30688d3d9ebfe779edd50619f14721c7d5.jpg","h":["Slaughterhouse","slaughterhouse"],"df":[],"r":{},"c":"other","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":605,"n":"Santa Slays Slackers","nr":"Санта убивает бездельников","d":"In the Santa's Workshop job, keep all the elves alive for 30 minutes after the first assault starts on the OVERKILL difficulty or above.","dr":"Выполняя контракт «Мастерская Санты» на уровне сложности «OVERKILL» или выше, не дайте полицейским освободить ни одного эльфа в течение 30 минут после начала первого полицейского штурма.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/8d1a5560fe8b22ffe47dcbbd0ba01a382c41adc0.jpg","h":["Santa’s Workshop","santa_workshop"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":606,"n":"Can You See The Light?","nr":"Ты видишь свет?","d":"Complete the Aftershock job on the Mayhem difficulty or above.","dr":"Завершите контракт «Последствия» на уровне сложности «Хаос» или выше.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/fac19736668da644d58675cac44e54d3dab5b12c.jpg","h":["Aftershock","aftershock"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":607,"n":"Pool Party","nr":"Вечеринка у бассейна","d":"Complete the Counterfeit job on the Mayhem difficulty or above.","dr":"Завершите контракт «Подделка» на уровне сложности «Хаос» или выше.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/338eb0423a83bc4e9cdb52095ba583882eeb95b8.jpg","h":["Counterfeit","counterfeit"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":608,"n":"Not on the Guest List","nr":"Не в списке гостей","d":"Complete the Nightclub job on the Death Sentence difficulty with the One Down mechanic activated.","dr":"Завершите контракт «Ночной клуб» на уровне сложности «Смертный приговор» с включенным модификатором одного падения.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/314c2fbb7e6a9ecffccd1d9c52825d7bf874efca.jpg","h":["Nightclub","nightclub"],"df":["death sentence"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":609,"n":"Destruction From Within","nr":"Удар изнутри","d":"Complete the Beneath the Mountain job on the OVERKILL difficulty or above.","dr":"Завершите контракт «У подножия горы» на уровне сложности «OVERKILL» или выше.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/5be4bc075a49ac2233d58e7b65334990acdfb04e.jpg","h":["Beneath the Mountain","beneath_mountain"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":610,"n":"Piranha","nr":"Пиранья","d":"Complete The Yacht Heist on the OVERKILL difficulty or above.","dr":"Завершите контракт «Яхта» на уровне сложности «OVERKILL» или выше.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/b0f0c15813ac34c2327aa81d2c1165e8504904e2.jpg","h":["The Yacht Heist","yacht"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":611,"n":"Fingers and Roads Crossed","nr":"Скрещенные пальцы и улицы","d":"Complete the Transport: Crossroads job on the OVERKILL difficulty or above.","dr":"Завершите контракт «Транспорт: перекресток» на уровне сложности «OVERKILL» или выше.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/f6e389b0cfa78bdc423d327fc5123768bd9a9989.jpg","h":["Transport","transport"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":612,"n":"Break out the Popcorn","nr":"Доставайте попкорн","d":"Complete the Reservoir Dogs job on the Very Hard difficulty or above.","dr":"Завершите контракт «Бешеные псы» на уровне сложности «Очень сложно» или выше.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/98f6e048f9209f3a815e52428b376bd261618a55.jpg","h":["Reservoir Dogs","reservoir_dogs"],"df":["hard","very hard"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":613,"n":"Fast Track to Hell","nr":"Короткий путь в ад","d":"Complete the Cursed Kill Room job on the Hard difficulty or above.","dr":"Завершите контракт «Проклятая полоса препятствий» на уровне сложности «Сложно» или выше.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/8a0282b55338f32dd28e701f401b019f96b59a75.jpg","h":["Cursed Kill Room","cursed_kill_room"],"df":["hard"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":614,"n":"A Junkyard Full Of Junkies","nr":"Свалка, полная отбросов","d":"On day 1 of the Big Oil job, kill all of the bikers within 1 minute of the heist starting.","dr":"Выполняя первый день контракта «Нефтяное дело», убейте всех байкеров за одну минуту после начала ограбления.","p":6.0,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/7273174d5cd16734d1d4510315199f5e7fda3880.jpg","h":["Big Oil","big_oil"],"df":[],"r":{},"c":"run_condition","sc":"heist","dy":1,"dp":[],"fit":"own"},{"i":615,"n":"Guessing Game","nr":"Угадай-ка","d":"On day 2 of the Firestarter job, complete the heist in stealth without hacking the computer.","dr":"Завершите второй день контракта «Поджигатель», не поднимая тревоги и не взламывая компьютер.","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/71bda81bbd8a315338ca9e9d00334cd6c0213ad2.jpg","h":["Firestarter","firestarter"],"df":[],"r":{},"c":"other","sc":"heist","dy":2,"dp":[],"fit":"own"},{"i":616,"n":"I Am the One Who Knocks","nr":"Я тот, кто стучит в дверь","d":"On day 1 of the Rats job, cook 3 bags worth of meth without letting any law enforcer enter the house.","dr":"Выполняя первый день контракта «Крысы», приготовьте 3 сумки мета, не впустив ни одного полицейского в дом.","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/acda7ac453050557e58e852b0db96b0f61e69c15.jpg","h":["Rats","rats"],"df":[],"r":{},"c":"run_condition","sc":"heist","dy":1,"dp":[],"fit":"own"},{"i":617,"n":"Water Works","nr":"Мокрая работа","d":"In the Safe House Nightmare job find the correct baby mask on the OVERKILL difficulty. Unlocks the \"Cry Baby\" mask.","dr":"Выполняя контракт «Кошмар в Убежище», найдите правильную маску ребенка на уровне сложности «OVERKILL» или выше. Открывает маску «Плачущий младенец».","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/c7a14506b526208c49f8dd20c09e54a4a66d8ca5.jpg","h":["Safe House: Nightmare","safe_house_nightmare"],"df":["overkill"],"r":{"masks":["Cry Baby"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":618,"n":"I Ain't Got Time to Bleed","nr":"У меня нет времени истекать кровью","d":"Kill 15 FBI SWAT and FBI Heavy SWAT units with a knife while at 25% or less health on the OVERKILL difficulty or above.","dr":"Убейте 15 SWAT FBI и тяжелого SWAT FBI ножом, имея не более 25% здоровья на уровне сложности «OVERKILL» или выше.","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/81f46b511425309ae6a3a8446893a9239126e40e.jpg","h":[],"df":["overkill"],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":619,"n":"Hot Lava 2.0","nr":"Пол - это лава 2.0","d":"On day 1 of the Election Day job, use the computer in stealth without ever touching the ground.","dr":"Выполняя первый день контракта «День выборов», используйте компьютер, не поднимая тревоги и не касаясь земли.","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/c80ee8e702bf2e6ec9d925f02111676682b81cc1.jpg","h":["Election Day","election_day"],"df":[],"r":{},"c":"other","sc":"heist","dy":1,"dp":[],"fit":"own"},{"i":620,"n":"Do You Like Hurting Other People?","nr":"Тебе нравится причинять людям боль?","d":"In the Hotline Miami job, kill 30 thugs with the Baseball Bat. Unlocks the \"Dennis\" mask, \"Solid Stock\" for the Uzi submachine gun, \"Wooden Grip\" for the Cobra submachine gun, \"Rubber\" material and \"Hip to Be Polygon\" pattern.","dr":"Выполняя контракт «Горячая линия Майами», убейте 30 бандитов бейсбольной битой. Выполнение достижения открывает маску «Деннис», прочный приклад для пистолета-пулемёта Uzi, деревянную рукоять для пистолета-пулемёта Cobra, а также материал «Резина» и рисунок «Многоугольник».","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/b8033987d025a57bbe2ca2e2b7e30217a399cff0.jpg","h":["Hotline Miami","hotline_miami"],"df":[],"r":{"masks":["Dennis"],"weapons":["Dennis","Solid Stock"],"materials":["Rubber"],"patterns":["Hip to Be Polygon"]},"c":"count","sc":"heist","dy":null,"dp":[],"fit":"extra"},{"i":621,"n":"Smoke and Mirrors","nr":"Дым и зеркала","d":"In The Diamond job, steal the Diamond and escape in under 10 minutes. Unlocks the \"Pazuzu\" mask, \"Diamond\" material and \"Horus\" pattern.","dr":"Выполняя контракт «Бриллиант», украдите Бриллиант и завершите контракт за 10 минут после начала ограбления. Выполнение достижения открывает маску «Пазузу», материал «Бриллиант» и рисунок «Гор».","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/61e71e7bc3abe92cc7507f9c209aeb4a87b32540.jpg","h":["The Diamond","the_diamond"],"df":[],"r":{"masks":["Pazuzu"],"materials":["Diamond"],"patterns":["Horus"]},"c":"run_condition","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":622,"n":"Tabula Rasa","nr":"Tabula Rasa","d":"In the Hoxton Breakout job, complete the heist on the OVERKILL difficulty or above with each crew member using no skills, wearing suits, wielding Golden AK.762 rifles and Chicago Typewriter submachine guns. Unlocks a new skill slot.","dr":"Завершите контракт «Спасение Хокстона» на сложности «OVERKILL» или выше так, чтобы все члены команды не потратили ни одного очка в деревьях навыков, носили костюмы и использовали золотые АК.762 и пистолеты-пулемёты Chicago Typewriter. Выполнение достижения открывает дополнительную ячейку для набора навыков.","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/51bbe2786357ef59ee25bae61333c6933d0149c2.jpg","h":["Hoxton Breakout","hoxton_breakout"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":623,"n":"Knockout!","nr":"Нокаут!","d":"Knock out a Bulldozer using the OVERKILL boxing gloves. Unlocks \"The Champ\" mask.","dr":"Нокаутируйте Бульдозера боксёрскими перчатками OVERKILL. Выполнение достижения открывает маску «Чемпион».","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/802bdf0299f8dbd0ef9bac33ff15d582db04f963.jpg","h":[],"df":["overkill"],"r":{"masks":["The Champ"]},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":624,"n":"A Pine in the Ass","nr":"Заноза в заднице","d":"Complete The Bomb: Forest job on the Death Wish difficulty or above.","dr":"Завершите контракт «Бомба: Лес» на уровне сложности «Жажда смерти» или выше.","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/96773582de120c8fef9df1eb6a68ec9f0e9a5ce9.jpg","h":["bomb_forest"],"df":["death wish"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":625,"n":"We Are Rockstars On This Job","nr":"Мы — рок-звёзды","d":"Complete the Watchdogs job with each crew member using no skills, wielding the AMCAR Rifle and Chimano 88 Pistol on the OVERKILL difficulty or above.","dr":"Завершите контракт «Сторожевые псы» вчетвером на уровне сложности «OVERKILL» или выше, используя винтовки AMCAR и одиночные пистолеты Chimano 88 так, чтобы ни у одного члена команды не было открыто ни одного навыка.","p":5.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/1138bb0a3618ad4 " for the AK weapon family, \"2 Piece Stock\" for the AK and CAR weapon families, \"Pachy\" mask, \"Fossil\" material and \"Prehistoric Predator\" pattern.","dr":"Завершите контракт «Художественная галерея» за 4 минуты, не поднимая тревоги, так, чтобы каждый член команды носил улучшенный КТЖ и не брал с собой на ограбление сумку с бронёй. Выполнение достижения открывает классический приклад для винтовок типа АК, приклад из двух частей для винтовок типа АК и CAR, маску «Пахи», материал «Окаменелость» и рисунок «Доисторический хищник».","p":5.8,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/b88a4e68ddac370d3f734fcfd93f6cdf2eecb739.jpg","h":["Art Gallery","art_gallery"],"df":[],"r":{"weapons":["Classic Stock"],"masks":["Pachy"],"materials":["Fossil"],"patterns":["Prehistoric Predator"]},"c":"run_condition","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":648,"n":"Oh, That's How You Do It","nr":"Ах вот как это делается","d":"Fire the Vulcan Minigun for 25 seconds without reloading or letting go of the trigger.","dr":"Непрерывно стреляйте из минигана Vulcan в течение 25 секунд.","p":5.8,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/4b2414d8d66c58d0de96a6500f533f4e46a07c03.jpg","h":[],"df":[],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":649,"n":"Stick a Fork in Me, I'm Done","nr":"Можешь воткнуть в меня вилку. Я готов.","d":"Set an enemy on fire and kill him with the \"Motherforker\" melee weapon. Unlocks \"The Gas Mask\" mask, \"Candlelight\" material and \"Flammable\" pattern.","dr":"Подожгите противника и убейте его оружием ближнего боя «Аста-ла-вилка». Выполнение достижения открывает маску «Противогаз», материал «Горящая свеча» и рисунок «Огнеопасно».","p":5.8,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/30295f89b455cbc44b59d4c28e815147f33747ef.jpg","h":[],"df":[],"r":{"masks":["The Gas Mask"],"materials":["Candlelight"],"patterns":["Flammab :"unknown"}],"fit":null},{"i":682,"n":"From Russia With Love","nr":"Из России с любовью","d":"While wearing the \"Mark\" mask, complete 25 of Vlad's jobs on the OVERKILL difficulty or above.","dr":"Нося маску «Марк», завершите 25 контрактов Влада на уровне сложности «OVERKILL» или выше.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/91a6e70864b138c6f527785eb0adc251507ec1da.jpg","h":[],"df":["overkill"],"r":{"masks":["Mark"]},"c":"collect","sc":"heist","dy":null,"dp":[{"mask":"Mark","unlocked_by":"Like an Angry Bear!","kind":"chain"}],"fit":null},{"i":683,"n":"Affordable Healthcare","nr":"Доступное здравоохранение","d":"While wearing the \"44th\" mask, place 61 doctor bags.","dr":"Нося маску «44ый», разложите 61 медицинскую сумку.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/770992208a17a2069f67a2ba0e617cf8f06df820.jpg","h":[],"df":[],"r":{"masks":["44th"]},"c":"mask_loadout","sc":"heist","dy":null,"dp":[{"mask":"44th","unlocked_by":null,"kind":"unknown"}],"fit":"own"},{"i":684,"n":"Reindeer Games","nr":"Скачки северных оленей","d":"Complete a heist while you and your four man crew are wearing one different Christmas soundtrack or community \"Santa\" mask each.","dr":"Завершите любой контракт вчетвером так, чтобы все члены команды носили 4 разные маски Санты.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/900e08de3a1bee792e530ad36534e5192905b004.jpg","h":[],"df":[],"r":{"masks":["Santa"]},"c":"collect","sc":"heist","dy":null,"dp":[{"mask":"Santa","unlocked_by":null,"kind":"unknown"}],"fit":null},{"i":685,"n":"Swing Dancing","nr":"Свинг","d":"Complete any single day of a heist, killing at least 50 enemies using only your melee weapon.","dr":"Завершите любой день контракта, убив не менее 50 противников, используя только оружие ближнего боя.Примечание: использование любого другого оружия аннулирует прогресс получения достижения.","p":5.6,"im Miami». Выполнение достижения открывает глушитель «Бесшумная смерть», сложенный приклад для пистолета-пулемёта Uzi, глушитель и модификацию «Без приклада» для пистолета-пулемёта Cobra, а также укороченный ствол для пистолета-пулемёта Blaster 9mm. Все четыре маски должны быть из DLC Hotline Miami; маски, полученные за владением игрой Hotline Miami, не учитываются для выполнения достижения.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/bae94952d84a35707525e648490aa115bc61ef1a.jpg","h":["Hotline Miami","hotline_miami"],"df":["hard"],"r":{"weapons":["Folded Stock","Silent Death"]},"c":"crew","sc":"heist","dy":null,"dp":[{"mask":"Hotline Miami","mask_set":true,"unlocked_by":["Phew!","Walk Faster","Overdose","Do You Like Hurting Other People?"],"from_dlc":"Hotline Miami","kind":"dlc_set"}],"fit":"extra"},{"i":689,"n":"I've Got the Power","nr":"Я чувствую власть","d":"In The Bomb: Dockyard job, don't let the enemies cut the power. Unlocks the \"Long Slide\" for the LEO pistol.","dr":"Выполняя контракт «Бомба: Доки», ни разу не дайте противникам отключить питание. Выполнение достижения открывает длинный затвор для пистолета LEO.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/6f851793f9a675eaeaf9ae85037ac8dc53f55fd0.jpg","h":["bomb_dockyard"],"df":[],"r":{"weapons":["Long Slide"]},"c":"weapon","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":690,"n":"I Have No Idea What I'm Doing","nr":"Я понятия не имею что я делаю","d":"In the Shadow Raid job, complete the heist in stealth while having the Vulcan Minigun and HRL-7 Rocket Launcher equipped.","dr":"Завершите контракт «Теневой рейд», не поднимая тревоги, используя миниган Vulcan и гранатомёт HRL-7.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/0879e6aa85b265f12375232625fe6d0d5f5cece7.jpg","h":["Shadow Raid","shadow_raid"],"df":[],"r":{},"c":"other","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":691,"n":"High Roller","nr":"Крупный игрок","d":"Complete the Golden Grin Casino job under 14 minutes. Unlocks \"The King\" mask, \"Plush\" material and \"Cards\" pattern.","dr":"Завершите контракт «Казино Golden Grin» не более чем за 14 минут. Выполнение достижения открывает маску «Да здравствует Король!», материал «Плюшевый» и рисунок «Карты».","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/58016e39c4fef77ecba96c89b93897508c85b3e0.jpg","h":["Golden Grin Casino","golden_grin"],"df":[],"r":{"masks":["The King"],"materials":["Plush"],"patterns":["Cards"]},"c":"mask_loadout","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":692,"n":"Hall of the Mountain King","nr":"Да здравствует король гор","d":"Complete the Beneath the Mountain job on the Death Wish difficulty or above.","dr":"Завершите ограбление «У подножия горы» на уровне сложности «Жажда смерти» или выше.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/a4b9963d27ce8f5685ba7843617c1120382da9a7.jpg","h":["Beneath the Mountain","beneath_mountain"],"df":["death wish"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":693,"n":"On the Seventh Try on Death Wish, My True Bain Gave to Me","nr":"На седьмую попытку Жажды смерти, послал мне верный Бэйн подмогу","d":"Complete the Santa's Workshop job on the Death Wish difficulty or above.","dr":"Завершите контракт «Мастерская Санты» на уровне сложности «Жажда смерти» или выше.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/62af51a7e98124712eb026656257568cedcd3b86.jpg","h":["Santa’s Workshop","santa_workshop"],"df":["death wish"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":694,"n":"Kiss the Chef","nr":"Чмокни повара","d":"In the Cook Off job, cook 25 bags of meth on the OVERKILL difficulty or above.","dr":"Выполняя контракт «Варка мета», приготовьте 25 сумок с метом на уровне сложности «OVERKILL» или выше.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/7a3d2546404dbf2d996fe6875ec0a0625820de72.jpg","h":["Cook Off","cook_off"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":695,"n":"Piggy Broke the Bank","nr":"Свинка разрушила Банк","d":"Complete The Big Bank job on the Death Sentence difficulty with the One Down mechanic activated.","dr":"Завершите контракт «Большой банк» на уровне сложности «Смертный приговор» с включенным модификатором одного падения.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/ab0d032576878cce8741ca0f387de35df1533c19.jpg","h":["Big Bank","big_bank"],"df":["death sentence"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":696,"n":"What Are You Sinking About","nr":"О чем ты заливаешься?","d":"Complete The Bomb: Dockyard job on the Mayhem difficulty or above.","dr":"Завершите контракт «Бомба: Доки» на уровне сложности «Хаос» или выше.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/fb9b99dedf4f144f920f6011d13d1a9feae98448.jpg","h":["bomb_dockyard"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":697,"n":"Only Losers Play Fair","nr":"Только неудачники играют по правилам","d":"Complete the Election Day job on the Death Sentence difficulty with the One Down mechanic activated.","dr":"Завершите контракт «День выборов» на уровне сложности «Смертный приговор» с включенным модификатором одного падения.","p":5.6,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/78e26f3c75de2b4e6c1d5dacb2ed50f31dd87f35.jpg","h":["Election Day","election_day"],"df":["death sentence"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":698,"n":"Caught in the Crossfire","nr":"Пойман в перекрестном огне","d":"Complete the Transport: Crossroads job on его боя.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/5d04047697b2bec3d818a7e12c25059a10cf8a1a.jpg","h":[],"df":[],"r":{"masks":["Venomorph"]},"c":"collect","sc":"heist","dy":null,"dp":[{"mask":"Venomorph","unlocked_by":null,"kind":"unknown"}],"fit":null},{"i":707,"n":"I Do What I Do Best, I Take Scores","nr":"Я делаю то, что умею лучше всего — занимаюсь делами","d":"While wearing the \"Hockey Heat\" mask, complete any Armored Transport heist 15 times on the OVERKILL difficulty or above.","dr":"Нося маску «Хоккейная схватка», завершите любой контракт «Транспорт» 15 раз на уровне сложности «OVERKILL» или выше.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/c1b23a813b79bce6d6e9e56eff06f259057ac729.jpg","h":["Transport","transport"],"df":["overkill"],"r":{"masks":["Hockey Heat"]},"c":"mask_loadout","sc":"heist","dy":null,"dp":[{"mask":"Hockey Heat","unlocked_by":"Heat Around the Corner","kind":"chain"}],"fit":"own"},{"i":708,"n":"I'm Not a Crook!","nr":"Я не жулик!","d":"While wearing the \"37th\" mask, kill 69 snipers using the Commando 553 rifle.","dr":"Нося маску «37ой», убейте 69 снайперов винтовкой Commando 553.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/46b6ab7daae6ccaf3a23733a4b0f753636721bb6.jpg","h":[],"df":[],"r":{"masks":["37th"]},"c":"count","sc":"heist","dy":null,"dp":[{"mask":"37th","unlocked_by":null,"kind":"unknown"}],"fit":"extra"},{"i":709,"n":"Fool Me Once, Shame on -Shame on You. Fool Me - You Can't Get Fooled Again","nr":"Обмани меня один раз — стыдно… как тебе не стыдно. Обмани меня один раз — и больше тебя не обдуришь","d":"While wearing the \"43rd\" mask, kill 95 Shields using the Swedish K submachine gun.","dr":"Нося маску «43ий», убейте 95 полицейских с щитом, используя пистолет-пулемёт Swedish K.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/fdc4fe5044e6c9ff871b2f6f2 твол для винтовки Nagant, точный ствол для пистолета Broomstick, увеличенный магазин и удлинённый ствол для пистолета-пулемёта Patchett L2A1, а также приглушённый ствол с перфорацией для пулемёта Buzzsaw 42.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/df047f029e442fad4cfdd4568a2d65ab6073fd50.jpg","h":["Hoxton Breakout","hoxton_breakout"],"df":["overkill"],"r":{"weapons":["Discreet Stock","Short Barrel"],"masks":["Historical"]},"c":"crew","sc":"heist","dy":null,"dp":[{"mask":"Historical","unlocked_by":null,"kind":"unknown"}],"fit":"extra"},{"i":715,"n":"Here Comes the Pain Train","nr":"Разбирайте костыли","d":"In the Firestarter job, complete the heist on the OVERKILL difficulty or above, with all days done in loud and with a crew of 4 players using unmodified \"AK Rifle\" rifles and \"PARA\" submachine guns. Unlocks the \"DMR Kit AK.762\" and the \"Low Drag Magazine\" for the AK weapon family, \"Timothy\" mask, \"Prehistoric\" material and \"Dinosaur Stripes\" pattern.","dr":"Завершите контракт «Поджигатель» вчетвером на уровне сложности «OVERKILL» или выше так, чтобы все члены команды использовали только немодифицированные винтовки АК и пистолеты-пулемёты Para. Выполнение достижения открывает набор DMR для AK.762, расширенный магазин для винтовок типа АК, а также маску «Тимоти», материал «Доисторический» и рисунок «Полосы на динозавре».","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/83fa94ca2d8eb4e5209ecf03728303daf89efd33.jpg","h":["Firestarter","firestarter"],"df":["overkill"],"r":{"masks":["Timothy"],"materials":["Prehistoric"],"patterns":["Dinosaur Stripes"],"weapons":["AK Rifle","PARA"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":716,"n":"Blood is Thicker Than Murkywater","nr":"Кровь, которая более густая чем у Murkywater","d":"Complete the Beneath the Mountain job on the Mayhem difficulty or above.","dr":"Завершите контракт «У подножия горы» на уровне сложности «Хаос» или выше.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/f5d2e888eeb82ba7e7370b27f9f9e1c1c54c8fcd.jpg","h":["Beneath the Mountain","beneath_mountain"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":717,"n":"SIX DOZERS CHARGING","nr":"ШЕСТЬ БУЛЬДОЗЕРОВ МЧАТ","d":"Complete the Santa's Workshop job on the Mayhem difficulty or above.","dr":"Завершите контракт «Мастерская Санты» на уровне сложности «Хаос» или выше.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/efb7081207ff6dc53d7916ad06f100ed99f55969.jpg","h":["Santa’s Workshop","santa_workshop"],"df":["mayhem"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":718,"n":"The one who declared himself the hero","nr":"Тот, кто назвал себя героем","d":"On the Diamond Store job or on day 1 of the Hoxton Breakout job, find and pick up the hidden Cultist Trophy five times. Unlocks \"The Cultist\" mask.","dr":"Выполняя первый день контракта «Спасение Хокстона» или контракт «Магазин бриллиантов», найдите спрятанную статуэтку культиста 5 раз. Выполнение достижения открывает маску «Культист».","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/709edeab5ed6c58316127c02329f9e56761a8e86.jpg","h":["Diamond Store","Hoxton Breakout","diamond_store","hoxton_breakout"],"df":[],"r":{"masks":["The Cultist"]},"c":"mask_loadout","sc":"heist","dy":1,"dp":[],"fit":"own"},{"i":719,"n":"Ally From the East","nr":"Союзники с востока","d":"Complete all of Vlad's contracts on the Hard difficulty or above.","dr":"Завершите все контракты Влада на уровне сложности «Сложно» или выше.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/a26abdc2cd719d3c01db1a7d3a1d7c5c059b69d1.jpg","h":[],"df":["hard"],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":720,"n":"Golf Oscar Alph avors on the OVERKILL difficulty or above.","dr":"Завершите контракт «Теневой рейд», не используя услуги препланирования, на уровне сложности «OVERKILL» или выше.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/bb0e49aa770ec82764b6e7c06dee4eec44c8344a.jpg","h":["Shadow Raid","shadow_raid"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":725,"n":"I'm Sure No One Heard That","nr":"Я уверен, что это никто не услышал","d":"On the Ukrainian Job, complete the heist in stealth after triggering the alarm with the metal detectors.","dr":"Завершите контракт «Украинское дело» скрытно после включения сирены металлодетектором.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/2a7698267be9deaa6b51aa91d83434770eaf86b5.jpg","h":["Ukrainian Job","ukrainian_job"],"df":[],"r":{},"c":"other","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":726,"n":"Kicked a Tumbleweed","nr":"Пнуть перекати-поле","d":"Complete the Henry's Rock job on the Very Hard difficulty or above.","dr":"Завершите контракт «Утес Генри», на уровне сложности «Очень сложно» или выше.","p":5.5,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/45e6700f28f722e8fed8c960859d01f1c5cb3c60.jpg","h":["Henry’s Rock","henrys_rock"],"df":["hard","very hard"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":727,"n":"I Did Not Have Sexual Relations With That Bulldozer","nr":"Я не имел интимных отношений с этим бульдозером!","d":"While wearing the \"42nd\" mask, trade 7 civilians.","dr":"Нося маску «42ой», обменяйте 7 заложников.","p":5.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/7db7e5b7a957bf59d8379646c87928fc5f986d46.jpg","h":[],"df":[],"r":{"masks":["42nd"]},"c":"mask_loadout","sc":"heist","dy":null,"dp":[{"mask":"42nd","unlocked_by":null,"kind":"unknown"}],"fit":"own"},{"i":728,"n":"Four Monkeys","nr":"Четыре обезьяны","d":"In the Rats job, complete the heist while you and your four man crew are wearing one different \"Shotgun Pack\" mask each on the OVERKILL difficulty or above.","dr":"Завершите контракт «Крысы» на уровне сложности «OVERKILL» или выше, когда на вас и на всех трёх напарниках надеты разные маски из комплекта «Shotgun Pack».","p":5.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/185425e852dfde131d5449d28cb4129fd3db56b4.jpg","h":["Rats","rats"],"df":["overkill"],"r":{"masks":["Shotgun Pack"]},"c":"crew","sc":"heist","dy":null,"dp":[{"mask":"Shotgun Pack","mask_set":true,"unlocked_by":["Seven Eleven","Bang for the Buck","No Heist for Old Men","Clay Pigeon Shooting","Four Monkeys"],"from_dlc":"Gage Shotgun Pack","kind":"dlc_set"}],"fit":"extra"},{"i":729,"n":"Riders On the Snowstorm","nr":"Наездники в снежной буре","d":"In the White Xmas job, complete the heist on the Death Wish difficulty or above while each crew member wears a different \"2014 Xmas\" mask each. Unlocks the \"Almir's Beard\" mask.","dr":"Завершите контракт «Снежное Рождество» вчетвером на уровне сложности «Жажда смерти» или выше так, чтобы все члены команды носили 4 разные маски из коллекции «2014 Xmas». Выполнение достижения открывает маску «Борода Алмира».","p":5.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/253e0b9d7d9977d50280c787157625225bddfde5.jpg","h":["White Xmas","white_xmas"],"df":["death wish"],"r":{"masks":["2014 Xmas","Almir's Beard"]},"c":"crew","sc":"heist","dy":null,"dp":[{"mask":"2014 Xmas","unlocked_by":null,"kind":"unknown"}],"fit":"extra"},{"i":730,"n":"Done in 60 Seconds","nr":"Украсть за 60 секунд","d":"In The Bomb: Dockyard job, open the dock gate in 60 seconds using the keycards. Unlocks the \"Custom Slide\" for the LEO pistol.","dr":"Выполняя контракт «Бомба: Доки», откройте ворота дока ключ-картами не более чем за 60 секунд после начала ограбления. Выполнение достижения открывает особый затвор для пистолета LEO.","p":5.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/47f95b3ac55369c041ef62fbf2e06dec15277ff1.jpg","h":["bomb_dockyard"],"df":[],"r":{"weapons":["Custom Slide"]},"c":"weapon","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":731,"n":"120 Proof","nr":"Меткий на все 120 %","d":"Kill 120 or more enemies in any day in a heist, with you and your four man crew having at least 120% crew accuracy at the end of the heist.","dr":"Выполняя вчетвером любой день любого контракта, убейте не менее 120 противников так, чтобы общая точность команды по результатам ограбления была не менее 120%.","p":5.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/488cde502674e735235a8512c2f72383fe837210.jpg","h":[],"df":[],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":732,"n":"Sound of Silence","nr":"Звук тишины","d":"Complete The Alesso Heist without your crew killing anyone. Unlocks the \"Boom Box\" mask, \"Enlightenment\" material and \"Alesso Logo\" pattern.","dr":"Завершите контракт «Алессо», никого не убив. Выполнение достижения открывает маску «Бумбокс», материал «Просветление» и рисунок «Логотип Алессо».","p":5.4,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/4586e6d0679c4d484536d9de3ae58ababb1e657b.jpg","h":["Alesso","the_alesso"],"df":[],"r":{"masks":["Boom Box"],"materials":["Enlightenment"],"patterns":["Alesso Logo"]},"c":"mask_loadout","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":733,"n":"Shuriken Shenanigans","nr":"Проделки сюрикена","d":"Complete a single day of a heist in stealth using only the Shuriken throwable and killing at least 4 enemies. Unlocks the \"Kuro Zukin\" mask, \"Bamboo\" material and \"Koi\" pattern.","dr":"Завершите любое скрытное ограбление, при этом убив четырёх противников, используя только сюрикены. Выполнение достижения открывает маску «Куро закин», материал «Бамбук» и рисунок «Кои».","p":5.4,"img":"ht _forest"],"df":[],"r":{"masks":["The Doctor"],"materials":["Plywood"],"patterns":["Caduceus"]},"c":"mask_loadout","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":759,"n":"Boston Saints","nr":"Святые из Бостона","d":"Complete the Big Oil job, with at least one other player, all using suits and Akimbo Bernetti 9 Pistols on the OVERKILL difficulty or above.","dr":"Завершите контракт «Нефтяное дело» на уровне сложности «OVERKILL» или выше так, чтобы как минимум двое игроков были в костюмах и с парными пистолетами Bernetti 9.","p":5.2,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/ca5d7fead00a888707c1e4f6eebce67cd59c58c3.jpg","h":["Big Oil","big_oil"],"df":["overkill"],"r":{},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":760,"n":"City of Sin and Well-Oiled Gears","nr":"Город грехов и качественных деталей","d":"Complete the Golden Grin Casino job without having the Big Fucking Drill ever break in loud. Unlocks the \"Murmillo Galea Helmet\" mask, \"Casino\" material and \"Royale\" pattern.","dr":"Завершите контракт «Казино Golden Grin» и ни разу не дайте BFD остановиться. Выполнение достижения открывает маску «Шлем мурмиллона», материал «Казино» и рисунок «Рояль».","p":5.2,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/60b6984c25cdb36371b1ce5fff9ec8bd96ac9d35.jpg","h":["Golden Grin Casino","golden_grin"],"df":[],"r":{"masks":["Murmillo Galea Helmet"],"materials":["Casino"],"patterns":["Royale"]},"c":"mask_loadout","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":761,"n":"Cloaker Fear","nr":"Боязнь Клокеров","d":"Complete the First World Bank job on the OVERKILL difficulty or above by securing all additional money bags while not using the loot vent bag shortcut for the additional money bags.","dr":"Завершите контракт «Первый Всемирный Банк» на уровне сложности «OVERKILL» или выше, унеся с собой все дополнительные сумки с деньгами, не используя вентиляцию для переноса дополнительн ing into custody. Unlocks the \"Risen Chains\" mask.","dr":"Завершите контракт «Тюремный кошмар» на уровне сложности «Хаос» или выше, добыв 15 ключ-карт и не позволив членам команды уйти под стражу. Открывает маску «Восставший Чейнс».","p":3.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/be6fbe36e9ee17bc6a116d470e0270a4e787170f.jpg","h":["Prison Nightmare","prison_nightmare"],"df":["mayhem"],"r":{"masks":["Risen Chains"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":974,"n":"He's Got Experience","nr":"У него есть опыт","d":"Complete the Prison Nightmare job on the Hard difficulty or above by having 1 player playing as Hoxton, all having Nova's Shank melee weapon equipped, and are only allowed to kill enemies using Nova's Shank. Unlocks the \"Risen Houston\" mask.","dr":"Завершите контракт «Тюремный кошмар» на уровне сложности «Сложно» или выше так, чтобы в команде был персонаж Хокстон, все члены команды выбрали оружие ближнего боя «Заточка Новы» и чтобы все убийства были сделаны только с этого оружия. Открывает маску «Восставший Хокстон».","p":3.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/d8e4fd087c17a20e8ec98c240fb9a8e52a16e649.jpg","h":["Prison Nightmare","prison_nightmare"],"df":["hard"],"r":{"masks":["Risen Houston"]},"c":"difficulty_ladder","sc":"heist","dy":null,"dp":[],"fit":"own"},{"i":975,"n":"Let Them Fly","nr":"Пусть летают","d":"Kill 50 Snipers with the Arbiter Grenade Launcher while using the standard ammo type.","dr":"Убейте 50 снайперов с гранатомета «Arbiter», используя стандартные патроны.","p":3.9,"img":"https://shared.fastly.steamstatic.com/community_assets/images/apps/218620/c33c95d7f8c0a0d0a69afc09b050188f511f1814.jpg","h":[],"df":[],"r":{},"c":"collect","sc":"heist","dy":null,"dp":[],"fit":null},{"i":976,"n":"Celsius or Fahrenheit?","nr":"Цельсий или Фаренгейт?","d":"Kill 10 enemies in a row, without missing, while switching between the regula
